<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><g transform="translate(512 512) scale(0.75) translate(-512 -530)">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5BD6"/><stop offset="1" stop-color="#4646C2"/>
    </linearGradient>
    <linearGradient id="clap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <mask id="m"><rect width="1024" height="1024" fill="#fff"/>
