  </g>
  <rect x="503" y="400" width="18" height="98" rx="9" fill="#fff"/>
       <rect x="503" y="420" width="18" height="80" rx="9" fill="#fff" transform="rotate(118 512 488)"/>
       <circle cx="512" cy="488" r="17" fill="#fff"/>
  
  <!-- clapper -->
